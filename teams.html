<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams - Royal Risers Cup</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
  <!-- Skip Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header>
    <nav class="container" aria-label="Main navigation">
      <a class="logo" href="index.html">
        <span class="logo-icon" aria-hidden="true"></span>
        Royal Risers Cup
      </a>
      
      <button class="mobile-menu-toggle" aria-label="Toggle navigation menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <ul class="nav-links" role="menubar">
        <li role="none"><a href="index.html" role="menuitem">Home</a></li>
        <li role="none"><a href="#" id="seasonLink" role="menuitem">Season</a></li>
        <li role="none"><a href="#" id="fixturesLink" role="menuitem">Fixtures</a></li>
        <li role="none"><a href="#" id="pointsLink" role="menuitem">Points Table</a></li>
        <li role="none"><a href="#" class="active" role="menuitem" aria-current="page">Teams</a></li>
        <li role="none"><a href="#" id="statsLink" role="menuitem">Stats</a></li>
      </ul>
    </nav>
  </header>

  <!-- Page Header -->
  <section class="hero hero-sub" id="heroSection" aria-labelledby="page-title">
    <div class="hero-bg-graphic" aria-hidden="true"></div>
    <div class="container">
      <nav aria-label="Breadcrumb" class="breadcrumb">
        <ol class="breadcrumb-list">
          <li class="breadcrumb-item"><a href="index.html" class="breadcrumb-home" aria-label="Home">Home</a></li>
          <li class="breadcrumb-item active" aria-current="page">Teams</li>
        </ol>
      </nav>
      <h1 id="pageTitle">Teams</h1>
      <p id="seasonInfo">Loading season information...</p>
    </div>
  </section>

  <!-- Main Content -->
  <main class="container section" id="main-content">
    <!-- Search and Filter -->
    <div class="card mb-lg">
      <div class="card-header">
        <h2 class="card-title">All Teams</h2>
        <div class="flex gap-md">
          <input type="search" id="teamSearch" class="form-input" placeholder="Search teams..." style="max-width: 250px;" aria-label="Search teams">
        </div>
      </div>
      <div id="teamsContent">
        <p class="loading">Loading teams...</p>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="developer-profile.html">Developer Profile</a>
        <a href="https://cricheroes.com/team-profile/9230662/royal-risers-hyd/profile" target="_blank" rel="noopener noreferrer">CricHeroes</a>
      </div>
      <p class="text-muted">&copy; 2026 Royal Risers Cup. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="js/teams.js"></script>
  
  <!-- Mobile menu script -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const menuToggle = document.querySelector('.mobile-menu-toggle');
      const navLinks = document.querySelector('.nav-links');
      
      if (menuToggle && navLinks) {
        menuToggle.addEventListener('click', function() {
          const isExpanded = this.getAttribute('aria-expanded') === 'true';
          this.setAttribute('aria-expanded', !isExpanded);
          navLinks.classList.toggle('active');
        });
      }
    });
  </script>
</body>
</html>
