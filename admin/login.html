<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Royal Risers Cup</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-page">
  <div class="login-container">
    <div class="login-card card">
      <div class="login-header">
        <h1><a class="logo" href="../index.html">Royal Risers Cup</a></h1>
        <p class="text-muted">Admin Login</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input" required autocomplete="email">
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" required autocomplete="current-password">
        </div>
        
        <div id="errorMessage" class="alert alert-error" style="display: none;"></div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
      </form>
      
      <div style="text-align: center; margin-top: var(--spacing-md);">
        <a href="../index.html" class="text-muted">Back to Home</a>
      </div>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
